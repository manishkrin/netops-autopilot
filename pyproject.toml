[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netops-autopilot"
version = "0.1.0"
description = "Approval-gated network incident investigation and remediation platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "NetOps Autopilot contributors" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlite-utils>=3.38,<4.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.11,<1.0",
]

[project.scripts]
netops-simulator = "netops_autopilot.simulator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netops_autopilot"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["netops_autopilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

